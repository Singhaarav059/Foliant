name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, translations, builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run i18n:check
      - name: Server build
        run: npm run build
      - name: Static build
        run: npm run build:static

  e2e:
    name: End-to-end (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:static
      - name: Install ${{ matrix.browser }}
        run: npx playwright-core install --with-deps ${{ matrix.browser }}
      - name: Serve the static build
        run: |
          nohup npm run serve:static > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3202/en > /dev/null && exit 0; sleep 1; done
          echo "Server did not start" && exit 1
      - name: Run tests
        run: npm run test:e2e -- ${{ matrix.browser }}
      - name: Error messages
        if: success() || failure()
        run: npm run test:e2e:errors -- ${{ matrix.browser }}
      - name: File intake
        if: success() || failure()
        run: npm run test:e2e:intake -- ${{ matrix.browser }}
      - name: Offline
        if: success() || failure()
        run: npm run test:e2e:offline -- ${{ matrix.browser }}

  pdf:
    name: PDF engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # veraPDF, the reference PDF/A validator, from its official image.
      - name: veraPDF
        run: |
          docker pull verapdf/cli:v1.30.2
          # The tests write files under /tmp; the container sees them at the same path.
          printf '#!/bin/sh\nexec docker run --rm -v /tmp:/tmp verapdf/cli:v1.30.2 "$@"\n' > "$RUNNER_TEMP/verapdf"
          chmod +x "$RUNNER_TEMP/verapdf"
      - run: npm run test:tables
      - run: npm run test:errors
        if: success() || failure()
      - run: npm run test:layout
      - run: npm run test:compress
      - run: npm run test:ocr
      - run: npm run test:redact
      - run: npm run test:office
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: npm run test:libreoffice
      - run: npm run test:ocr-accuracy
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: npm run test:pdfa
        env:
          VERAPDF: ${{ runner.temp }}/verapdf
