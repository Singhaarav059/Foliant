name: Live site

# Checks the deployed site every week, so a host change, an expired domain or
# a broken deploy shows up as a failed run (GitHub emails the owner) even
# when nobody is pushing. Set the SITE_URL repository variable (Settings →
# Secrets and variables → Actions → Variables), for example
# https://nopload.example. Run it by hand from the Actions tab, optionally
# against another address.
#
# The header checks expect a host that applies out/_headers (Cloudflare Pages,
# Netlify). On GitHub Pages, which ignores it, also set the variable
# HOST_HEADERS to "none": pages and files are still checked, their headers and
# first-visit cross-origin isolation are not.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      site_url:
        description: "Site to check (default: the SITE_URL variable)"
        required: false

permissions:
  contents: read
  actions: write # the keepalive step below

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    name: Check ${{ inputs.site_url || vars.SITE_URL }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SITE_URL: ${{ inputs.site_url || vars.SITE_URL }}
      HOST_HEADERS: ${{ vars.HOST_HEADERS }}
    steps:
      - name: Site address
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::Set the SITE_URL repository variable to the deployed site's address."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - id: install
        run: npm ci
      - name: Headers, 404s and pages
        run: node scripts/live-check.mjs "$SITE_URL"
      - name: Chromium
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx playwright-core install --with-deps chromium
      - name: End-to-end tests against the site
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:e2e -- chromium
        env:
          BASE_URL: ${{ env.SITE_URL }}
      # Lighthouse budgets (P3-03, lighthouserc.json): script weight, no
      # third-party requests, layout shift, and accessibility and SEO scores,
      # on the home page, a tool and an info page.
      - name: Lighthouse budgets
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx --yes @lhci/cli@0.14.0 autorun --collect.url="$SITE_URL/en" --collect.url="$SITE_URL/en/merge-pdf" --collect.url="$SITE_URL/en/faq" --collect.chromePath="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
      # GitHub turns off scheduled workflows in public repositories after 60
      # days without activity. Re-enabling this one each run keeps it on
      # without committing anything.
      - name: Keep the schedule alive
        if: ${{ always() && github.event_name == 'schedule' }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/live.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
