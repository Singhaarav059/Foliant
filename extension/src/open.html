<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open in Nopload</title>
<link rel="stylesheet" href="open.css">
</head>
<body>
<main>
  <img src="icons/48.png" width="48" height="48" alt="">
  <h1 id="title">Open in Nopload</h1>
  <p id="text"></p>
  <p id="file" class="file"></p>
  <button id="allow" type="button" hidden>Allow and open</button>
  <p class="note">The file goes from that site straight to the Nopload tab in your browser. It isn't uploaded anywhere, and the add-on collects no data.</p>
</main>
<script src="open.js"></script>
</body>
</html>
